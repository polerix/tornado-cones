name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage runtime files
        run: |
          mkdir -p _site/fonts _site/images
          cp index.html manifest.json _site/
          cp "fonts/VAG Rounded Regular.ttf" fonts/digibox-sharp.otf _site/fonts/
          cp "looping a disc.mp3" "tornado cones.mp3" _site/
          cp images/backgroundart.png images/disc_texture.png images/tornado_texture.png _site/images/
          cp images/favicon.ico images/icon-*.png _site/images/
          cp images/noun-handbrake-active-1873218.svg images/noun-musical-note-8103489.svg images/noun-sound-7599094.svg _site/images/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
